@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--card:#1b231d;--tx:#e9efe9;--mu:#98a69b;--ac:#58c47e;--ac2:#0c1a11;--bd:#2f3d33;--red:#ff8a80;--am:#f0c050}}
:root[data-theme="dark"]{--bg:#121813;--card:#1b231d;--tx:#e9efe9;--mu:#98a69b;--ac:#58c47e;--ac2:#0c1a11;--bd:#2f3d33;--red:#ff8a80;--am:#f0c050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:21px;margin:0;color:var(--ac)}
h2{font-size:17px;margin:0 0 8px}
.mode{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-weight:700}
nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
input{width:100%;padding:10px;margin:0 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:700}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:4px 12px;font-weight:700}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.mu{color:var(--mu);font-size:14px}
.q{display:flex;align-items:center;gap:8px}.q b{min-width:20px;text-align:center}
.tot{font-size:18px;font-weight:700;margin:8px 0}
.st{font-size:13px;font-weight:700;color:var(--am)}.st.d{color:var(--ac)}
.empty{color:var(--mu);padding:6px 0}
.hid{display:none}
.note{font-size:13px;color:var(--mu);margin-top:14px}

.bgl{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--logo) center 40%/min(92vw,520px) no-repeat;opacity:.1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgl{opacity:.18;filter:brightness(1.7)}}
:root[data-theme="dark"] .bgl{opacity:.18;filter:brightness(1.7)}
.wrap{position:relative;z-index:1;padding-bottom:90px}
.box{background:color-mix(in srgb,var(--card) 90%,transparent);animation:up .55s ease both}
.box:nth-of-type(2){animation-delay:.08s}.box:nth-of-type(3){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ic{display:inline-block;width:50px;height:34px;vertical-align:middle;margin-inline-end:8px;background:var(--icon) center/contain no-repeat;animation:fl 3.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-3px)}}
.btn,.mode,nav button{transition:transform .12s,background .2s}
.btn:active,.mode:active,nav button:active{transform:scale(.95)}
.bump{animation:bp .3s}@keyframes bp{50%{transform:scale(1.5);color:var(--lime)}}
.bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--ac);color:var(--ac2);border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:700;animation:sl .3s both}
.bar .btn{background:var(--ac2);color:var(--ac)}.bar.hid{display:none}.bar.pop{animation:pp .3s}
@keyframes sl{from{transform:translateY(30px);opacity:0}}@keyframes pp{50%{transform:scale(1.04)}}
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#1b5a36;overflow:hidden;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.sp-bg{position:absolute;inset:-30px;background:var(--banner) center/cover;filter:blur(22px) brightness(.6)}
.sp-c{position:relative;width:100%;padding:0 14px;text-align:center;color:#fff}
.sp-img{width:100%;max-width:560px;aspect-ratio:1220/496;margin:0 auto;border-radius:14px;background:var(--banner) center/cover;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:zi 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes zi{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
.sp-c h2{font-size:26px;margin:22px 0 4px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:up .8s .5s both}
.sp-c p{margin:0;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:up .8s .7s both}
.sp-bar{width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.35);margin:22px auto 0;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--lime);transform-origin:right;animation:ld 2.6s ease-out both}
@keyframes ld{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.err{color:var(--red);font-size:14px;min-height:20px}.lnk{color:var(--ac);text-decoration:underline;margin:10px 0;cursor:pointer}
</style>
</head>
<body>
<div class="bgl"></div>
<div id="splash"><div class="sp-bg"></div><div class="sp-c"><div class="sp-img"></div><h2>الجبل الأخضر</h2><p>حلول مبتكرة لزراعة مستدامة</p><div class="sp-bar"><i></i></div></div></div>
<div class="wrap">
<header><h1><span class="ic"></span>الجبل الأخضر</h1><button class="mode hid" id="out">خروج</button></header>

<!-- شاشة الدخول -->
<div id="auth" class="hid"><div class="box">
  <h2 id="aT">تسجيل الدخول</h2>
  <input id="aId" placeholder="رقم التليفون" inputmode="email" autocomplete="username">
  <input id="aPw" type="password" placeholder="كلمة السر (6 أحرف أو أرقام على الأقل)" autocomplete="current-password">
  <div id="reg" class="hid"><input id="aName" placeholder="الاسم"><input id="aAddr" placeholder="العنوان"></div>
  <button class="btn" id="aGo">دخول</button>
  <p class="lnk" id="aSw">معندكش حساب؟ سجّل حساب جديد</p>
  <div class="err" id="aErr"></div>
</div></div>

<!-- شاشات العميل -->
<div id="cust" class="hid">
<nav><button data-t="shop" class="on">المنتجات</button><button data-t="mine">مشترياتي</button></nav>
<section id="shop">
  <div class="box"><h2 id="hi"></h2><input id="cAddr" placeholder="عنوان التوصيل"></div>
  <div class="box"><h2>المنتجات</h2><div id="pList"></div></div>
  <div class="box"><h2>سلتك</h2><div id="cart"></div><div class="tot" id="cTot"></div><button class="btn" id="order">اطلب دلوقتي</button></div>
</section>
<section id="mine" class="hid"><div class="box"><h2>سجل مشترياتك</h2><div id="myList"></div></div></section>
</div>

<!-- شاشات صاحب المحل -->
<div id="own" class="hid">
<nav><button data-t="ord" class="on">الطلبات</button><button data-t="prod">المنتجات</button><button data-t="cl">العملاء</button></nav>
<section id="ord"><div class="box"><h2>الطلبات</h2><div id="oList"></div></div></section>
<section id="prod" class="hid">
  <div class="box"><h2>إضافة منتج</h2><input id="nName" placeholder="اسم المنتج"><input id="nPrice" type="number" inputmode="decimal" placeholder="السعر"><button class="btn" id="nAdd">إضافة</button></div>
  <div class="box"><h2>كل المنتجات</h2><div id="aList"></div></div>
</section>
<section id="cl" class="hid"><div class="box"><h2>سجل كل عميل</h2><div id="clList"></div></div></section>
</div>
</div>
<div id="bar" class="bar hid"><span id="bc"></span><button class="btn" id="go">اطلب</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

// ===== 1) الاتصال بمشروعك على Firebase =====
const app = initializeApp({ apiKey: "AIzaSyAd-0uzrGRgk4biZFmc5D4MbaC5MCUBSwQ", authDomain: "gabal-akhdar.firebaseapp.com", projectId: "gabal-akhdar", storageBucket: "gabal-akhdar.firebasestorage.app", messagingSenderId: "653394412475", appId: "1:653394412475:web:782367756c02b4c3013a9e" });
const auth = getAuth(app), db = getFirestore(app);
const OWNER = "abdooz.mahmed@gmail.com";   // إيميل صاحب المحل

// ===== 2) متغيرات ودوال مساعدة =====
const $ = id => document.getElementById(id);
const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
const ST = ["جديد", "في الطريق", "تم التسليم"];
let P = [], O = [], cart = {}, last = 0, stops = [], me = null, mode = "login", regData = null, isOwner = false;
const sum = ls => ls.reduce((a, l) => a + l.n * l.price, 0);
const when = t => new Date(t).toLocaleString("ar-EG");
function show(id) { ["auth", "cust", "own"].forEach(x => $(x).classList.toggle("hid", x !== id)); }
function tabs(box) {
  document.querySelectorAll("#" + box + " nav button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#" + box + " nav button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("#" + box + " section").forEach(s => s.classList.toggle("hid", s.id !== b.dataset.t));
  });
}
tabs("cust"); tabs("own");

// ===== 3) تسجيل الدخول: رقم التليفون بيتحوّل لإيميل داخلي =====
function emailOf(v) {
  v = v.trim(); if (v.includes("@")) return v.toLowerCase();
  const d = v.replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g, "");
  return d.length >= 10 ? d + "@gabal.app" : "";
}
const MSG = { "auth/invalid-credential": "الرقم أو كلمة السر غلط", "auth/email-already-in-use": "الرقم ده مسجل قبل كده، سجّل دخول", "auth/weak-password": "كلمة السر قصيرة، اكتب 6 على الأقل", "auth/too-many-requests": "محاولات كتير، استنى شوية" };
const err = t => $("aErr").textContent = t;
$("aSw").onclick = () => {
  mode = mode === "login" ? "reg" : "login"; err("");
  $("reg").classList.toggle("hid", mode === "login");
  $("aT").textContent = mode === "login" ? "تسجيل الدخول" : "حساب جديد";
  $("aGo").textContent = mode === "login" ? "دخول" : "سجّل";
  $("aSw").textContent = mode === "login" ? "معندكش حساب؟ سجّل حساب جديد" : "عندك حساب؟ سجّل دخول";
};
$("aGo").onclick = async () => {
  err(""); const id = $("aId").value, pw = $("aPw").value, em = emailOf(id);
  if (!em) { err("اكتب رقم تليفون صحيح"); return; }
  try {
    if (mode === "reg") {
      const name = $("aName").value.trim();
      if (id.includes("@")) { err("التسجيل برقم التليفون بس"); return; }
      if (!name) { err("اكتب اسمك"); return; }
      regData = { name: name, phone: em.split("@")[0], addr: $("aAddr").value.trim() };
      const c = await createUserWithEmailAndPassword(auth, em, pw);
      await setDoc(doc(db, "users", c.user.uid), regData);
    } else await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) { regData = null; err(MSG[e.code] || "حصلت مشكلة، اتأكد من النت وجرّب تاني"); }
};
$("out").onclick = () => signOut(auth);

// ===== 4) لما حالة الدخول تتغير: نشغّل الاستماع للبيانات =====
const bad = e => console.log(e);
onAuthStateChanged(auth, async u => {
  stops.forEach(f => f()); stops = []; P = []; O = []; cart = {}; me = u;
  $("out").classList.toggle("hid", !u);
  if (!u) { show("auth"); draw(); return; }
  isOwner = u.email === OWNER;
  stops.push(onSnapshot(collection(db, "products"), s => { P = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); }, bad));
  if (isOwner) {
    stops.push(onSnapshot(collection(db, "orders"), s => { O = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); }, bad));
    show("own");
  } else {
    let p = regData;
    if (!p) { try { const s = await getDoc(doc(db, "users", u.uid)); p = s.exists() ? s.data() : {}; } catch (e) { p = {}; } }
    me = { uid: u.uid, name: p.name || "", phone: p.phone || (u.email || "").split("@")[0] };
    $("hi").textContent = "أهلًا يا " + (me.name || "عميلنا"); $("cAddr").value = p.addr || "";
    stops.push(onSnapshot(query(collection(db, "orders"), where("uid", "==", u.uid)), s => { O = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); }, bad));
    show("cust");
  }
});

// ===== 5) العميل: السلة والطلب =====
window.chg = (id, d) => { last = id; cart[id] = Math.max(0, (cart[id] || 0) + d); draw(); };
$("order").onclick = async () => {
  const addr = $("cAddr").value.trim();
  const ls = P.filter(p => cart[p.id] > 0).map(p => ({ name: p.name, n: cart[p.id], price: p.price }));
  if (!addr) { alert("اكتب عنوان التوصيل"); return; }
  if (!ls.length) { alert("السلة فاضية"); return; }
  try {
    await addDoc(collection(db, "orders"), { uid: me.uid, name: me.name, phone: me.phone, addr: addr, lines: ls, total: sum(ls), st: 0, t: Date.now() });
    cart = {}; draw(); alert("تم إرسال طلبك ✔");
  } catch (e) { alert("الطلب ماتبعتش، اتأكد من النت وجرّب تاني"); }
};
$("go").onclick = () => $("order").scrollIntoView({ behavior: "smooth", block: "center" });

// ===== 6) صاحب المحل: الطلبات والمنتجات =====
window.nxt = (id, st) => updateDoc(doc(db, "orders", id), { st: st + 1 });
window.delP = id => { if (confirm("تمسح المنتج؟")) deleteDoc(doc(db, "products", id)); };
window.editP = (id, old) => { const v = prompt("السعر الجديد", old); if (v !== null && !isNaN(parseFloat(v))) updateDoc(doc(db, "products", id), { price: parseFloat(v) }); };
$("nAdd").onclick = async () => {
  const n = $("nName").value.trim(), p = parseFloat($("nPrice").value);
  if (!n || isNaN(p)) { alert("اكتب اسم المنتج وسعره"); return; }
  try { await addDoc(collection(db, "products"), { name: n, price: p }); $("nName").value = ""; $("nPrice").value = ""; } catch (e) { alert("ماتحفظش، جرّب تاني"); }
};

// ===== 7) الرسم على الشاشة =====
function ordHTML(o, own) {
  return '<div class="it"><div><b>' + (own ? esc(o.name) + " – " + esc(o.phone) : "طلب " + when(o.t)) + '</b>' +
    (own ? '<div class="mu">' + esc(o.addr) + " – " + when(o.t) + '</div>' : "") +
    o.lines.map(l => '<div class="mu">' + esc(l.name) + " × " + l.n + '</div>').join("") +
    '<span class="st ' + (o.st == 2 ? "d" : "") + '">' + ST[o.st] + '</span></div>' +
    '<div><b>' + o.total + '</b>' + (own && o.st < 2 ? '<br><button class="btn s" onclick="nxt(\'' + o.id + '\',' + o.st + ')">' + (o.st == 0 ? "خرج للتوصيل" : "تم التسليم") + '</button>' : "") + '</div></div>';
}
function draw() {
  const sorted = O.slice().sort((a, b) => b.t - a.t);
  if (isOwner) {
    $("oList").innerHTML = sorted.map(o => ordHTML(o, true)).join("") || '<div class="empty">مفيش طلبات لسه.</div>';
    $("aList").innerHTML = P.map(p => '<div class="it"><span>' + esc(p.name) + " – " + p.price + '</span><span><button class="btn s" onclick="editP(\'' + p.id + '\',' + p.price + ')">سعر</button> <button class="btn s" onclick="delP(\'' + p.id + '\')">حذف</button></span></div>').join("") || '<div class="empty">ضيف أول منتج من فوق.</div>';
    const by = {};
    O.forEach(o => { const k = by[o.phone] = by[o.phone] || { name: o.name, n: 0, t: 0 }; k.n++; k.t += o.total; });
    $("clList").innerHTML = Object.keys(by).map(k => '<div class="it"><div><b>' + esc(by[k].name) + '</b><div class="mu">' + esc(k) + '</div></div><div>' + by[k].n + " طلب – " + by[k].t + '</div></div>').join("") || '<div class="empty">مفيش عملاء لسه.</div>';
    $("bar").classList.add("hid"); return;
  }
  $("pList").innerHTML = P.map(p => '<div class="it"><div><b>' + esc(p.name) + '</b><div class="mu">' + p.price + ' جنيه</div></div><div class="q"><button class="btn s" onclick="chg(\'' + p.id + '\',-1)">−</button><b' + (last == p.id ? ' class="bump"' : '') + '>' + (cart[p.id] || 0) + '</b><button class="btn s" onclick="chg(\'' + p.id + '\',1)">+</button></div></div>').join("") || '<div class="empty">لسه مفيش منتجات، ارجع بعد شوية.</div>';
  const ls = P.filter(p => cart[p.id] > 0);
  const cnt = ls.reduce((a, p) => a + cart[p.id], 0), tt = ls.reduce((a, p) => a + p.price * cart[p.id], 0);
  $("cart").innerHTML = ls.map(p => '<div class="it"><span>' + esc(p.name) + " × " + cart[p.id] + '</span><span>' + p.price * cart[p.id] + '</span></div>').join("") || '<div class="empty">السلة فاضية.</div>';
  $("cTot").textContent = cnt ? "الإجمالي: " + tt + " جنيه" : "";
  const bar = $("bar"); bar.classList.toggle("hid", !cnt || !me);
  $("bc").textContent = cnt + " منتج – " + tt + " جنيه";
  if (last) { bar.classList.remove("pop"); void bar.offsetWidth; bar.classList.add("pop"); last = 0; }
  $("myList").innerHTML = sorted.map(o => ordHTML(o, false)).join("") || '<div class="empty">لسه مفيش مشتريات.</div>';
}

// شاشة الافتتاح
setTimeout(() => $("splash").classList.add("out"), 2900);
$("splash").onclick = function () { this.classList.add("out"); };
</script>
</body>
</html>
